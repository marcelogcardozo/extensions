<!doctype html>
<meta charset="utf-8">
<title>YouTube Downloader Helper</title>
<style>
  :root {
    color-scheme: light dark;
    --vermelho: #c00;
    --linha: color-mix(in srgb, currentColor 13%, transparent);
    --fraco: color-mix(in srgb, currentColor 8%, transparent);
  }
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    font: 13px/1.45 system-ui, sans-serif;
  }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }

  #titulo {
    font-size: 12px;
    opacity: .75;
    margin-bottom: 10px;
    max-height: 3em;
    overflow: hidden;
  }
  #seletor {
    display: none;
    width: 100%;
    margin-bottom: 10px;
    padding: 6px;
    font: inherit;
  }
  .opcoes { display: none; gap: 6px; margin-bottom: 10px; }
  #qualidade {
    flex: 0 0 auto;
    padding: 7px 4px;
    font: inherit;
  }
  #nome {
    flex: 1;
    min-width: 0;
    padding: 7px 8px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--linha);
    border-radius: 6px;
  }
  #nome::placeholder { opacity: .5; }

  #ja-baixado {
    margin-bottom: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 12px;
    background: var(--fraco);
    border-left: 3px solid var(--vermelho);
  }
  #ja-baixado[hidden] { display: none; }

  button {
    font: inherit;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  #baixar {
    width: 100%;
    padding: 9px;
    font-weight: 600;
    background: var(--vermelho);
    color: #fff;
  }
  #baixar:disabled { background: #999; cursor: default; }

  #status {
    margin-top: 8px;
    font-size: 12px;
    min-height: 1.4em;
    white-space: pre-wrap;
    max-height: 170px;
    overflow-y: auto;
    overflow-wrap: anywhere;
  }
  /* Erros podem trazer a lista de formatos do yt-dlp: monoespacado, e
     selecionavel para dar para copiar e colar. */
  .erro {
    color: var(--vermelho);
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    user-select: text;
  }
  .aguardando { opacity: .75; }

  /* ------------------------------------------------ listas de downloads */

  section { margin-top: 14px; border-top: 1px solid var(--linha); padding-top: 10px; }
  section[hidden] { display: none; }

  h2 {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .55;
    margin: 0 0 8px;
  }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  /* Linhas e colunas explicitas: deixar o grid posicionar sozinho foi o que
     jogou a etapa para a direita, espremida contra a borda. */
  .linha {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 8px;
    align-items: start;
  }
  .nome {
    grid-area: 1 / 1;
    font-size: 12px;
    /* Duas linhas antes de cortar: titulo de aula so se distingue no fim. */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* A etapa fica embaixo e alinhada a esquerda, junto do que ela descreve.
     A direita ela nao tinha largura garantida e era a primeira a ser cortada. */
  .etapa {
    grid-area: 3 / 1 / auto / -1;
    font-size: 11px;
    opacity: .6;
    font-variant-numeric: tabular-nums;
  }

  .barra {
    grid-area: 2 / 1 / auto / -1;
    height: 5px;
    border-radius: 3px;
    background: var(--fraco);
    overflow: hidden;
  }
  .barra > div {
    height: 100%;
    width: 0;
    background: var(--vermelho);
    transition: width .25s;
  }

  .acoes { grid-area: 3 / 1 / auto / -1; display: flex; gap: 6px; }
  .acoes button {
    flex: 1;
    padding: 5px;
    font-size: 11px;
    background: var(--fraco);
    color: inherit;
  }
  .acoes .continuar { font-weight: 600; }
  .acoes .descartar.confirmando { background: var(--vermelho); color: #fff; }

  .interrompida .etapa { grid-area: 2 / 1 / auto / -1; }
  .interrompida .acoes { grid-area: 3 / 1 / auto / -1; }

  .cancelar {
    grid-area: 1 / 2;
    width: 20px;
    height: 20px;
    padding: 0;
    line-height: 1;
    font-size: 14px;
    background: var(--fraco);
    color: inherit;
  }
</style>

<h1>YouTube Downloader Helper</h1>
<div id="titulo"></div>
<select id="seletor"></select>
<div id="ja-baixado" hidden>Este vídeo já está na sua pasta.</div>
<div class="opcoes">
  <select id="qualidade">
    <option value="melhor">Melhor</option>
    <option value="1080">1080p</option>
    <option value="720">720p</option>
    <option value="audio">Só áudio</option>
  </select>
  <input id="nome" type="text" maxlength="120" autocomplete="off"
         spellcheck="false" placeholder="Renomear (opcional)">
</div>
<button id="baixar" disabled>Procurando vídeo...</button>
<div id="status"></div>

<section id="sec-andamento" hidden>
  <h2>Em andamento</h2>
  <ul id="lista-andamento"></ul>
</section>

<section id="sec-interrompidos" hidden>
  <h2>Interrompidos</h2>
  <ul id="lista-interrompidos"></ul>
</section>

<script src="popup.js"></script>
