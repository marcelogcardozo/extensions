# Lint e do repositorio inteiro, nao de um projeto: a configuracao mora no
# pyproject.toml da raiz e vale para todo Python que entrar aqui.
name: lint

on:
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.py', 'pyproject.toml', '.github/workflows/lint.yml']

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff check --output-format=github
      - run: ruff format --check
